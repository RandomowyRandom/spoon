[package]
name = "spoon"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Git GUI client with a Material 3 Expressive interface"
license = "MIT"

[dependencies]
eframe = "0.37.0"
egui_material_icons = "0.9.0"
material-colors = "0.5.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
